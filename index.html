<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Private client-only Philippine semi-monthly payroll estimator." />
    <meta name="theme-color" content="#174a3a" />
    <title>Payroll Lite PH</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <p class="eyebrow">PRIVATE · CLIENT-ONLY</p>
          <h1>Payroll Lite <span>PH</span></h1>
        </div>
        <div class="topbar-actions">
          <button class="button button-ghost" id="edit-profile">Edit profile</button>
          <button class="button button-ghost" id="delete-data">Delete local data</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="profile-view" class="view"></section>
      <section id="calculator-view" class="view hidden"></section>
      <section id="results-view" class="view hidden"></section>
    </main>

    <footer class="footer">
      <span>Stored only in this browser · No account · No server</span>
      <span id="rule-footer"></span>
    </footer>
    <div id="cookie-banner" class="cookie-banner hidden" role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-description">
      <div>
        <h2 id="cookie-title">Privacy notice</h2>
        <p id="cookie-description">Payroll Lite PH stores your profile and saved payroll months in this browser. It does not use tracking cookies. <a href="cookies.html">Read the cookie policy</a>.</p>
      </div>
      <div class="cookie-actions">
        <button class="button button-secondary" id="cookie-decline" type="button">Decline</button>
        <button class="button button-primary" id="cookie-accept" type="button">Accept</button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
